name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build --no-restore --configuration Debug

    - name: Test (Schlieren.Tests)
      run: dotnet test Schlieren.Tests/Schlieren.Tests.csproj --no-build --configuration Debug --logger "trx;LogFileName=test-results.trx"

    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results
        path: Schlieren.Tests/TestResults/*.trx

  lint:
    runs-on: windows-latest
    needs: build

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore
      run: dotnet restore

    - name: Build Release
      run: dotnet build --no-restore --configuration Release

    - name: Verify no warnings
      run: |
        $warnings = dotnet build --no-restore --configuration Release 2>&1 | Select-String "warning"
        if ($warnings) {
          Write-Error "Build has warnings:"
          $warnings | ForEach-Object { Write-Host $_ }
          exit 1
        }

  # Optional: Scheduled EELS conformance sweep
  eels-conformance:
    runs-on: windows-latest
    needs: build
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Download fixtures
      shell: pwsh
      run: |
        # Download Cancun fixtures if not present
        if (-not (Test-Path "fixtures/state_tests/cancun")) {
          Write-Host "Note: EELS fixtures should be downloaded separately for conformance testing"
        }

    - name: Restore
      run: dotnet restore

    - name: Build
      run: dotnet build --no-restore --configuration Debug

    - name: Run EELS conformance
      shell: pwsh
      env:
        EELS_FIXTURES_ROOT: fixtures/state_tests/cancun
        EELS_INCLUDE_SUBDIRS: "1"
      run: |
        if (Test-Path $env:EELS_FIXTURES_ROOT) {
          dotnet test Schlieren.EELS.Tests/Schlieren.EELS.Tests.csproj --filter "BENCHMARK_TaxonomySnapshot" --logger "trx"
        } else {
          Write-Host "EELS fixtures not available - skipping conformance test"
        }
