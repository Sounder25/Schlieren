name: EELS Conformance Gate

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  conformance-gate:
    name: EELS Conformance & Taxonomy Sweep
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build solution
        run: dotnet build Schlieren.sln -c Release

      - name: Run Core Unit Tests
        run: dotnet test Schlieren.Tests/Schlieren.Tests.csproj -c Release --no-build

      - name: Run EELS Cancun Conformance & Taxonomy Drill
        env:
          EELS_FIXTURES_ROOT: ${{ github.workspace }}/fixtures/state_tests
          EELS_REQUIRED_FORK: Cancun
          EELS_INCLUDE_SUBDIRS: "1"
          EELS_MAX_CASES: "99999"
        run: |
          dotnet test Schlieren.EELS.Tests/Schlieren.EELS.Tests.csproj \
            -c Release \
            --no-build \
            --filter "EelsTaxonomyDrill|CancunOpcodeGasConformanceTests" \
            --logger "trx;LogFileName=eels_conformance_results.trx"

      - name: Upload Test Results Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eels-conformance-results
          path: |
            Schlieren.EELS.Tests/TestResults/*.md
            Schlieren.EELS.Tests/TestResults/*.trx
