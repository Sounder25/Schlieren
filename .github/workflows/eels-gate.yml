name: EELS Conformance Gate

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  conformance-gate:
    name: EELS Conformance & Taxonomy Sweep
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Download EELS fixtures (tests@v20.0.1)
        run: |
          mkdir -p fixtures
          curl -L --retry 3 \
            "https://github.com/ethereum/execution-specs/releases/download/tests%40v20.0.1/fixtures.tar.gz" \
            -o fixtures/fixtures.tar.gz
          tar -xzf fixtures/fixtures.tar.gz -C fixtures/
          rm fixtures/fixtures.tar.gz
          echo "Fixtures extracted:"
          ls fixtures/

      - name: Build solution
        run: dotnet build Scrutor.sln -c Release

      - name: Run Core Unit Tests
        run: dotnet test Scrutor.Tests/Scrutor.Tests.csproj -c Release --no-build

      - name: Run EELS Cancun Conformance & Taxonomy Drill
        env:
          EELS_FIXTURES_ROOT: ${{ github.workspace }}/fixtures/fixtures/state_tests
          EELS_REQUIRED_FORK: Cancun
          EELS_INCLUDE_SUBDIRS: "1"
          EELS_MAX_CASES: "99999"
        run: |
          dotnet test Scrutor.EELS.Tests/Scrutor.EELS.Tests.csproj \
            -c Release \
            --no-build \
            --filter "EelsTaxonomyDrill|CancunOpcodeGasConformanceTests" \
            --logger "trx;LogFileName=eels_conformance_results.trx"

      - name: Upload Test Results Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eels-conformance-results
          path: |
            Scrutor.EELS.Tests/TestResults/*.md
            Scrutor.EELS.Tests/TestResults/*.trx
