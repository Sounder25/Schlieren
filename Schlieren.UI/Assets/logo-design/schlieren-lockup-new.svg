<!-- SCHLIEREN — Full Logo Lockup (wordmark + icon)
     Icon left, wordmark right. Used in header bar.
     Width: 320px, Height: 56px nominal
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 56" width="320" height="56">
  <defs>
    <linearGradient id="g-flow" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4A00E0"/>
      <stop offset="55%" stop-color="#2D6AE0"/>
      <stop offset="100%" stop-color="#19D7E5"/>
    </linearGradient>
    <linearGradient id="g-text-split" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E8ECF4"/>
      <stop offset="60%" stop-color="#E8ECF4"/>
      <stop offset="100%" stop-color="#19D7E5"/>
    </linearGradient>
    <filter id="f-glow">
      <feGaussianBlur stdDeviation="1.4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="f-wave">
      <feGaussianBlur stdDeviation="0.7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="c-icon">
      <circle cx="28" cy="28" r="25.5"/>
    </clipPath>
  </defs>

  <!-- ICON MARK (56×56 circle scaled to 56px tall) -->
  <!-- Background -->
  <circle cx="28" cy="28" r="28" fill="#070810"/>
  <radialGradient id="g-bg-lk" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#12163A"/>
    <stop offset="100%" stop-color="#070810"/>
  </radialGradient>
  <circle cx="28" cy="28" r="28" fill="url(#g-bg-lk)"/>

  <g clip-path="url(#c-icon)">
    <!-- Wavefront arcs left -->
    <g filter="url(#f-wave)" opacity="0.5">
      <path d="M 10 8 Q 6 28 10 48" fill="none" stroke="#4A00E0" stroke-width="0.9" stroke-linecap="round"/>
      <path d="M 14 7 Q 8 28 14 49" fill="none" stroke="#2D6AE0" stroke-width="0.8" stroke-linecap="round"/>
      <path d="M 18 6 Q 11 28 18 50" fill="none" stroke="#3A50E0" stroke-width="0.75" stroke-linecap="round"/>
    </g>
    <!-- Wavefront arcs right -->
    <g filter="url(#f-wave)" opacity="0.5">
      <path d="M 46 8 Q 50 28 46 48" fill="none" stroke="#19D7E5" stroke-width="0.9" stroke-linecap="round"/>
      <path d="M 42 7 Q 48 28 42 49" fill="none" stroke="#1BC8E8" stroke-width="0.8" stroke-linecap="round"/>
      <path d="M 38 6 Q 45 28 38 50" fill="none" stroke="#2DAEEA" stroke-width="0.75" stroke-linecap="round"/>
    </g>
    <!-- Slit edges -->
    <rect x="24.5" y="7" width="1.5" height="42" rx="0.7"
          fill="url(#g-flow)" filter="url(#f-glow)" opacity="0.9"/>
    <rect x="30" y="7" width="1.5" height="42" rx="0.7"
          fill="url(#g-flow)" filter="url(#f-glow)" opacity="0.9"/>
    <!-- Center node -->
    <circle cx="28" cy="28" r="2.8" fill="url(#g-flow)" filter="url(#f-glow)" opacity="0.9"/>
    <circle cx="28" cy="28" r="1.1" fill="#FFFFFF" opacity="0.95" filter="url(#f-glow)"/>
    <!-- Horizontal ticks -->
    <line x1="23" y1="18" x2="33" y2="18" stroke="url(#g-flow)" stroke-width="0.6" opacity="0.6"/>
    <line x1="23" y1="28" x2="33" y2="28" stroke="#FFFFFF" stroke-width="0.7" opacity="0.45"/>
    <line x1="23" y1="38" x2="33" y2="38" stroke="url(#g-flow)" stroke-width="0.6" opacity="0.6"/>
    <!-- Mid wavefronts -->
    <g opacity="0.3">
      <path d="M 19 18 Q 28 17 37 18" fill="none" stroke="#7A8FFF" stroke-width="0.6"/>
      <path d="M 18 28 Q 28 26 38 28" fill="none" stroke="#A0F0FF" stroke-width="0.6"/>
      <path d="M 19 38 Q 28 39 37 38" fill="none" stroke="#7A8FFF" stroke-width="0.6"/>
    </g>
  </g>

  <!-- Icon ring -->
  <circle cx="28" cy="28" r="25.5" fill="none"
          stroke="url(#g-flow)" stroke-width="1" opacity="0.55"/>
  <!-- Ring ticks -->
  <line x1="28" y1="2.5" x2="28" y2="5.5" stroke="#19D7E5" stroke-width="1" opacity="0.8"/>
  <line x1="28" y1="50.5" x2="28" y2="53.5" stroke="#19D7E5" stroke-width="1" opacity="0.8"/>

  <!-- WORDMARK -->
  <!-- Main name: SCHLIEREN — split color at last 2 chars "EN" in aqua -->
  <!-- Font: Geist/Inter fallback rendered as text — will be correct in SVG viewers with system fonts -->
  <text x="68" y="37"
        font-family="'Geist', 'Inter', 'Segoe UI', system-ui, sans-serif"
        font-size="26"
        font-weight="700"
        letter-spacing="-0.8"
        fill="#E8ECF4">SCHLIE</text>
  <text x="221" y="37"
        font-family="'Geist', 'Inter', 'Segoe UI', system-ui, sans-serif"
        font-size="26"
        font-weight="700"
        letter-spacing="-0.8"
        fill="#19D7E5">REN</text>

  <!-- Tagline -->
  <text x="68" y="50"
        font-family="'Geist Mono', 'JetBrains Mono', 'Consolas', monospace"
        font-size="8.5"
        font-weight="400"
        letter-spacing="1.4"
        fill="#6B7785"
        text-transform="uppercase">ETHEREUM EXECUTION ENGINE</text>
</svg>
