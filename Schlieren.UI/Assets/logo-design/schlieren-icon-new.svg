<!-- SCHLIEREN — App Icon / Favicon mark
     Concept: Schlieren wavefront — a single sharp interference glyph.
     The form is a vertical slit aperture (the schlieren method's knife edge)
     with wavefront distortion lines emanating from it — reads as both
     an "S" (negative space in the curves) and a physics instrument.
     Palette: deep void black + execution indigo + blob aqua gradient.
     Clean at 16px, impressive at 512px.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <!-- Core gradient: indigo → aqua -->
    <linearGradient id="g-flow" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4A00E0"/>
      <stop offset="55%" stop-color="#2D6AE0"/>
      <stop offset="100%" stop-color="#19D7E5"/>
    </linearGradient>

    <!-- Glow for the aperture slit -->
    <filter id="f-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Subtle outer glow for wavefronts -->
    <filter id="f-wave-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Clip to circle -->
    <clipPath id="c-circle">
      <circle cx="50" cy="50" r="46"/>
    </clipPath>
  </defs>

  <!-- Background: near-void with subtle radial -->
  <circle cx="50" cy="50" r="50" fill="#070810"/>
  <radialGradient id="g-bg" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#12163A" stop-opacity="1"/>
    <stop offset="100%" stop-color="#070810" stop-opacity="1"/>
  </radialGradient>
  <circle cx="50" cy="50" r="50" fill="url(#g-bg)"/>

  <g clip-path="url(#c-circle)">
    <!-- WAVEFRONT ARCS — distorted light curves, left side (compressed) -->
    <!-- These arcs bow leftward = dense medium, like heat haze -->
    <g filter="url(#f-wave-glow)" opacity="0.55">
      <!-- Far left, tight compression -->
      <path d="M 20 18 Q 12 50 20 82" fill="none" stroke="#4A00E0" stroke-width="1.3" stroke-linecap="round"/>
      <path d="M 25 16 Q 15 50 25 84" fill="none" stroke="#3A50E0" stroke-width="1.2" stroke-linecap="round"/>
      <path d="M 30 14 Q 19 50 30 86" fill="none" stroke="#2D6AE0" stroke-width="1.1" stroke-linecap="round"/>
    </g>

    <!-- WAVEFRONT ARCS — right side (expanded / rarefied) -->
    <g filter="url(#f-wave-glow)" opacity="0.55">
      <path d="M 80 18 Q 88 50 80 82" fill="none" stroke="#19D7E5" stroke-width="1.3" stroke-linecap="round"/>
      <path d="M 75 16 Q 85 50 75 84" fill="none" stroke="#1BC8E8" stroke-width="1.2" stroke-linecap="round"/>
      <path d="M 70 14 Q 81 50 70 86" fill="none" stroke="#2DAEEA" stroke-width="1.1" stroke-linecap="round"/>
    </g>

    <!-- CENTRAL SCHLIEREN SLIT — the knife-edge aperture, vertical bar -->
    <!-- Left edge of slit -->
    <rect x="44" y="14" width="2.5" height="72" rx="1.2"
          fill="url(#g-flow)" filter="url(#f-glow)" opacity="0.9"/>
    <!-- Right edge of slit -->
    <rect x="53.5" y="14" width="2.5" height="72" rx="1.2"
          fill="url(#g-flow)" filter="url(#f-glow)" opacity="0.9"/>

    <!-- THE CORE BEAM — light passing through the slit, brightest element -->
    <!-- Central bright column, slight taper top/bottom -->
    <path d="M 47 14 L 53 14 L 54 50 L 53 86 L 47 86 L 46 50 Z"
          fill="url(#g-flow)" opacity="0.15"/>

    <!-- Aperture cross-hatch — interference dot at center -->
    <circle cx="50" cy="50" r="4.5" fill="url(#g-flow)" opacity="0.9" filter="url(#f-glow)"/>
    <circle cx="50" cy="50" r="2" fill="#FFFFFF" opacity="0.95" filter="url(#f-glow)"/>

    <!-- Horizontal node markers — tick marks on the slit at thirds -->
    <line x1="43" y1="32" x2="57" y2="32" stroke="url(#g-flow)" stroke-width="0.8" opacity="0.6"/>
    <line x1="43" y1="50" x2="57" y2="50" stroke="#FFFFFF" stroke-width="1" opacity="0.5"/>
    <line x1="43" y1="68" x2="57" y2="68" stroke="url(#g-flow)" stroke-width="0.8" opacity="0.6"/>

    <!-- Mid wavefronts — crossing the slit, showing diffraction -->
    <g opacity="0.35">
      <path d="M 35 32 Q 50 30 65 32" fill="none" stroke="#7A8FFF" stroke-width="0.9"/>
      <path d="M 33 50 Q 50 47 67 50" fill="none" stroke="#A0F0FF" stroke-width="0.9"/>
      <path d="M 35 68 Q 50 70 65 68" fill="none" stroke="#7A8FFF" stroke-width="0.9"/>
    </g>
  </g>

  <!-- Outer ring — precision border -->
  <circle cx="50" cy="50" r="46" fill="none"
          stroke="url(#g-flow)" stroke-width="1.5" opacity="0.6"/>
  <!-- Tick marks at cardinal points on ring -->
  <line x1="50" y1="4" x2="50" y2="9" stroke="#19D7E5" stroke-width="1.5" opacity="0.8"/>
  <line x1="50" y1="91" x2="50" y2="96" stroke="#19D7E5" stroke-width="1.5" opacity="0.8"/>
  <line x1="4" y1="50" x2="9" y2="50" stroke="#4A00E0" stroke-width="1.5" opacity="0.8"/>
  <line x1="91" y1="50" x2="96" y2="50" stroke="#4A00E0" stroke-width="1.5" opacity="0.8"/>
</svg>
